<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #fce4ec;
      margin: 0;
      padding: 0;
      color: #880e4f;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      color: #e91e63;
      font-size: 2.5rem;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #880e4f;
    }
    .heart {
      font-size: 3rem;
      color: #e91e63;
      margin: 20px 0;
    }
    .footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #ad1457;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Yay! She said YES! &#x2764;</h1>
    
    <div class="heart">&#x2764;</div>
    
    <p>Hi {{to_name}},</p>
    
    <p>{{message}}</p>
    
    <p>Love,<br>
    {{from_name}}</p>
    
    <div class="footer">
      Sent with love from your Valentine App
    </div>
  </div>
</body>
</html>
